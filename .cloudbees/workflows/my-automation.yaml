apiVersion: automation.cloudbees.io/v1alpha1
kind: workflow
name: My automation
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      Short_Description:
        type: string
        default: my change request short description
        description: short description of ServiceNow change request
      Description:
        type: string
        default: my detailed change request description
jobs:
  ci-job:
    steps:
      - uses: docker://alpine/git:latest
        run: |
          git config --global --add safe.directory /cloudbees/workspace
      - uses: cloudbees-io/checkout@v1
        name: checkout
      - uses: docker://golang:1.20
        name: Build Go app
        run: |
          go build -v ./...
      - uses: docker://golang:1.20
        name: Run tests
        run: |
          go test -v ./...
      - uses: cloudbees-io/sonarqube-bundled-sast-scan-code@v1
        kind: scan
      - uses: cloudbees-io/sonarqube-bundled-sast-scan-code@v1
        kind: scan
